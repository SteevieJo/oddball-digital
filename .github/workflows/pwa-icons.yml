name: Build PWA icons
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pwa-icons.yml'
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate PNG PWA icons
        shell: python
        run: |
          import struct,zlib
          def png(path,n):
              raw=b''.join(b'\x00'+b'\x08\x0e\x15\xff'*n for _ in range(n))
              def chunk(t,d):
                  return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
              data=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',n,n,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
              open(path,'wb').write(data)
          png('icon-192.png',192)
          png('icon-512.png',512)
      - name: Commit icons
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          git diff --cached --quiet || (git commit -m "Add PNG PWA icons" && git push)
