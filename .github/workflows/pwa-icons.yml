name: Build PWA icons
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/pwa-icons.yml']
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write PNG icons
        shell: bash
        run: |
          echo '' | base64 -d > icon-192.png
          echo '' | base64 -d > icon-512.png
      - name: Commit icons
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          git diff --cached --quiet || (git commit -m "Add PNG PWA icons" && git push)
